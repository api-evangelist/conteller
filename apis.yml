name: Conteller
description: >-
  Conteller is a user-generated content (UGC) marketplace where brands pay for
  authentic media directly from their own customers and everyday, non-famous
  creators. Brands publish media briefs and the platform lets creators capture,
  submit, and store photos, videos, and TikTok-style content, then handles
  paying those creators for approved submissions. A Mexican/Spanish startup
  (Madrid) selected for Batch 19 of 500 Global's Somos Lucha accelerator program
  in Latin America, Conteller has run pilots spanning roughly 1,400 creators and
  a dozen brands. It was added to the API Evangelist network as a portfolio lead
  of 500 Global. As of this profile the public site is a disabled Vercel
  deployment and no public developer portal, API, or documentation surface has
  been found.
